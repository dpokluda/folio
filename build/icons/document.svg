<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="152" y1="62" x2="872" y2="962" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EAEF"/>
    </linearGradient>
    <linearGradient id="fold" x1="652" y1="62" x2="652" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCE2E9"/>
      <stop offset="1" stop-color="#BFC8D2"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="332" x2="0" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0EA5A3"/>
    </linearGradient>
  </defs>

  <!-- sheet of paper with the upper-right corner folded back -->
  <path d="M 182 62
           L 631 62
           Q 652 62 673 83
           L 851 261
           Q 872 282 872 312
           L 872 932
           Q 872 962 842 962
           L 182 962
           Q 152 962 152 932
           L 152 92
           Q 152 62 182 62 Z"
        fill="url(#page)" stroke="#808A96" stroke-width="26" stroke-linejoin="round"/>

  <!-- the folded-back corner flap -->
  <path d="M 673 83
           L 851 261
           Q 872 282 842 282
           L 682 282
           Q 652 282 652 252
           L 652 92
           Q 652 62 673 83 Z"
        fill="url(#fold)" stroke="#808A96" stroke-width="26" stroke-linejoin="round"/>

  <!-- Folio glyph (F + editor caret), matching the app tile artwork -->
  <g transform="translate(512 610) scale(1.3) translate(-523 -512)">
    <g fill="#2D333B">
      <!-- vertical stem -->
      <rect x="356" y="316" width="86" height="392" rx="30"/>
      <!-- top arm -->
      <rect x="356" y="316" width="270" height="84" rx="30"/>
      <!-- middle arm -->
      <rect x="356" y="470" width="210" height="80" rx="28"/>
    </g>

    <!-- editor caret accent -->
    <rect x="656" y="332" width="34" height="360" rx="17" fill="url(#caret)"/>
  </g>
</svg>
